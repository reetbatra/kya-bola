[project]
name = "indic-asr-atlas"
version = "0.1.0"
description = "District- and language-level benchmark of Indic speech recognition, built on the Vaani corpus."
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=3.0",
    "soundfile>=0.12",
    "numpy>=1.26",
    "jiwer>=3.0",
    "indic-nlp-library>=0.92",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "shapely>=2.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[project.optional-dependencies]
local-asr = ["torch>=2.4", "transformers>=4.44", "faster-whisper>=1.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["harness/tests"]
